<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <section id="game">
        <h1>🐣 たまごっち 🐣</h1>

        <!-- husdjur -->
        <div id="pet">🙂</div>

        <!-- Status -->
        <div class="stats">
            <p>Hunger: <span id="hunger">50</span></p>
            <p>Glädje: <span id="happiness">50</span></p>
            <p>Energi: <span id="energy">50</span></p>
        </div>

        <!-- Knappar -->
        <div class="controls">
            <button id="feed">Mata</button>
            <button id="play">Leka</button>
            <button id="sleep">Sova</button>
        </div>

        <!-- Game over -->
        <p id="message"></p>
        <button id="restart" hidden>Starta om</button>
    </section>
</body>
</html>
